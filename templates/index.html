<!DOCTYPE html>
<html>
<head>
    <title>AI Phishing Detector</title>

    <style>

        body{
            background: linear-gradient(to right, #141e30, #243b55);
            font-family: Arial;
            color: white;
            text-align: center;
            margin-top: 100px;
        }

        .container{
            width: 500px;
            margin: auto;
            padding: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
        }

        input{
            width: 90%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            margin-top: 20px;
        }

        button{
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #00c6ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        h1{
            margin-bottom: 20px;
        }

        h2{
            margin-top: 25px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🛡️ AI Phishing URL Detector</h1>

        <form action="/predict" method="post">

            <input type="text" name="url" placeholder="Enter URL here..." required>

            <br>

            <button type="submit">Check URL</button>

        </form>

        <h2>{{ prediction_text }}</h2>

    </div>

</body>
</html>
